name: HAWK
options:
  bundleIdPrefix: com.hawk
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  PRODUCT_BUNDLE_IDENTIFIER: com.hawk.music
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
targets:
  HAWK:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Resources
    info:
      path: Configuration/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hawk.music
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: Configuration/Info.plist
      ENABLE_PREVIEWS: YES
    dependencies:
      - package: HAWK
        product: HawkCore
      - package: HAWK
        product: HawkSecurity
      - package: HAWK
        product: HawkNetworking
      - package: HAWK
        product: HawkSources
      - package: HAWK
        product: HawkPlayback
      - package: HAWK
        product: HawkLyrics
      - package: HAWK
        product: HawkStats
      - package: HAWK
        product: HawkUI
