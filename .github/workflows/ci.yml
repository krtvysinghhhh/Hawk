name: HAWK CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify Modules
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true

      - name: Swift Version
        run: swift --version

      - name: Compile Core Modules
        run: ./Scripts/build.sh

      - name: Run Automated Verification Suite
        run: ./Scripts/verify.sh
